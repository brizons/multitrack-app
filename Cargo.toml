[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/engine",
    "crates/library",
    "crates/render-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
engine = { path = "crates/engine" }
library = { path = "crates/library" }
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
