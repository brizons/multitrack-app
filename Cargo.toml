[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/domain",
    "crates/engine",
    "crates/io-cpal",
    "crates/library",
    "crates/play-cli",
    "crates/render-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
app = { path = "crates/app" }
domain = { path = "crates/domain" }
engine = { path = "crates/engine" }
io-cpal = { path = "crates/io-cpal" }
library = { path = "crates/library" }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossterm = "0.29.0"
hound = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
triple_buffer = "9.0.1"
