[package]
name = "openvamp"
description = "Desktop shell for Mac, Windows and Linux: the Perform screen drawn with GPUI, calling the app crate directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "openvamp_desktop"
path = "src/lib.rs"

[[bin]]
name = "openvamp"
path = "src/main.rs"

[dependencies]
app.workspace = true
domain.workspace = true
# `runtime_shaders`: on macOS, GPUI compiles its Metal shaders when the app
# starts instead of at build time, so building needs no Metal Toolchain
# (Xcode 26 ships it as a separate download). Other platforms ignore it.
gpui = { workspace = true, features = ["runtime_shaders"] }
io-cpal.workspace = true
library.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
